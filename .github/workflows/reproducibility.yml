name: Manuscript analysis

on:
  push:
    branches: [main]
    paths:
      - reproducibility_package/**
      - .github/workflows/reproducibility.yml
      - README.md
  pull_request:
    paths:
      - reproducibility_package/**
      - .github/workflows/reproducibility.yml
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out the manuscript package
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: reproducibility_package
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: reproducibility_package/requirements.txt
      - name: Install the pinned analysis dependency
        run: python -m pip install -r reproducibility_package/requirements.txt
      - name: Verify archives and reproduce the manuscript analysis
        run: python reproducibility_package/analyze.py --output results.json
